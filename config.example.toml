# Example settings for ops-suite. Placeholder values only.
#
# Copy this file to the platform config folder as "config.toml", or point to a copy with
# --config PATH or the OPS_SUITE_CONFIG environment variable. A missing file is not an error.
# Precedence, highest first: CLI flags, OPS_SUITE_* environment variables, a .env file in the
# working directory, this file, built-in defaults.
#
# No secrets in this file. Secrets are kept in the operating system's credential store.

[paths]
# Optional overrides; default to the platform's user data / log folders for app "ops-suite".
data_dir = ""
log_dir = ""

[mail.work]
# The shared mailbox's own address. Mail sent from it is the desk's own and is skipped.
mailbox_address = "shared-mailbox@example.edu"
# Local path of the synced drop folder (one JSON file per message).
drop_dir = ""
# Days that handled files stay in processed/ and rejected/ before they are deleted. Integer >= 1.
retention_days = 7
# Senders to skip: full addresses, or "@domain" to match a whole domain.
automated_senders = []
# Skip senders whose local part (before the @) starts with one of these.
automated_local_parts = ["no-reply", "noreply", "donotreply", "do-not-reply", "mailer-daemon", "postmaster"]

[tdx]
# The TDX web app's start page (TDWorkManagement). Read-only use: the tool never types or
# submits in TDX; "tdx rows" clicks nothing but the widgets' "next page" button.
base_url = "https://tdx.example.edu/TDWorkManagement/"
# Optional; defaults to <data_dir>/tdx/browser-profile. It holds live session cookies, so keep it
# outside the repository and never copy or share it.
profile_dir = ""
# Optional: where "tdx rows" starts. Normally left empty: "ops-suite tdx set-dashboard" saves
# the right address for you. If set, it must be on the base_url host and overrides the saved one.
dashboard_url = ""
# The time zone TDX shows dates in.
display_timezone = "America/New_York"
# Where "tdx watch" and "tdx audit" read the queue: "browser"; "shadow" to read it through
# the TDX Web API too and compare the two, cards from the browser (see [tdx.shadow]); or "api"
# for cards from the API, with the browser reading any run the API cannot (docs/USAGE.md,
# "Reading through the API"). "shadow" and "api" need [tdx.api] enabled and both report ids.
source = "browser"
# "tdx rows" only: run the browser without a window. --headed overrides it.
headless = true
# Pages read per widget before stopping (1-100).
max_pages_per_widget = 20
# Seconds to wait for the dashboard, each widget and each page turn (5-120).
page_timeout_seconds = 30
# Seconds Chromium gets to start (15-180). Raise it if "tdx watch" reports launch_timeout.
browser_launch_timeout_seconds = 60
# Extra requests the read-only guard lets through, each "METHOD /path/pattern" with digit runs
# written as # (for example "POST /TDWorkManagement/WorkManagement/Example/#"). Add an entry only
# after reviewing it: an allowed write is a write to TDX (docs/USAGE.md, "Read-only by design").
allowed_requests = []
# "tdx audit": seconds to pause between tickets (0-30), and how many ticket feeds one run opens
# (1-200, oldest Modified first; the rest wait for the next run).
feed_delay_seconds = 2
max_feeds_per_run = 40
# "tdx audit", optional: a ticket address with {id} for the ticket id, on the base_url host. Used
# when the dashboard's ticket link does not lead to the activity feed. Normally left empty.
ticket_url_template = ""

[tdx.widgets]
# Dashboard widget titles, matched ignoring case and extra spaces.
unclaimed_title = "Unclaimed Tickets in My Group(s)"
claimed_title = "Active Tickets Claimed by Others in My Group(s)"

[tdx.rules]
# "tdx audit": a ticket is stale after this many hours (calendar time, weekends included).
stale_hours = 48
# An event ticket is "over, ready to resolve" this many hours after the event.
event_over_hours = 24
# "Location TBD" is flagged when the event is this many days away or less.
event_tbd_days = 3
# Optional override, normally empty. Normally not needed: desk members are learned from Prim
# Resp, private notes, merge notices and the desk signature in their replies. These are real
# people's names: keep them only in your own config file, never in the repository.
extra_staff_names = []
# A visible reply whose own text (quoted mail cut first) contains one of these phrases marks
# its author as desk staff, remembered like the other strong signals. Matched ignoring case
# and extra spaces; the requester never becomes desk this way, and no reply text is kept.
desk_signatures = ["SCIS Commons Support", "CCI Commons Support"]
# No "client waiting" on a ticket a desk member opened (an internal reminder or notice),
# counted "Internal (desk requester)" instead. Only certain desk members count: Prim Resp,
# private-note, merge-notice and desk-signature authors, the desk-member memory and
# extra_staff_names above.
skip_desk_requestors = true
# Remember desk members across runs, so one sighting as Prim Resp, a private-note author,
# a merge-notice author or a signed reply's author is enough from then on. Stored as salted hashes only, never names, in
# desk-members.json in the data folder; delete that file to reset it.
desk_memory = true
# Forget a remembered desk member not seen for this many days (30-730).
desk_memory_forget_days = 180
# "Ready to close": the desk replied last at least this many days ago (1-30) and the requester
# has been silent since. Listed in shift summaries; see alert_ready_to_close below.
close_after_days = 3
# Shift summaries mark "(possible duplicate of #id)" when the requester is the same and the
# titles' words overlap this much (0-1, Jaccard) or one title contains the other.
duplicate_title_similarity = 0.6

[tdx.events]
# Event requests (tdx audit): unclaimed tickets still titled like the request form get their
# page opened at any age, and renamed "EVENT [...]" tickets when their next date is
# outreach_days away or less. Only the form's dates, recurring answer, "I am looking:", space
# and services are read from the description, in memory; nothing else is kept. The college is
# now the SCIS (formerly CCI): both names are listed here and in the options below, so the
# form keeps matching whichever name it shows.
form_titles = ["CCI Event Request Form", "SCIS Event Request Form"]
# "Event outreach due": A/V or a classroom asked for, no desk reply yet, and the event this
# many days away or less (1-90). It turns high at urgent_days (0-30) or less.
outreach_days = 14
urgent_days = 3
# "Event details pending": the desk asked 48+ hours ago, no answer, and the event this many
# days away or less (1-90).
details_pending_days = 7
# Within this many days of the event (0-30), "waiting on the requester" and "requester
# replied" are raised at once, at high priority.
near_event_days = 2
# The form's options, matched ignoring case at the start of an answer.
marketing_only_prefixes = ["Marketing/advertising"]
av_service_prefixes = ["A/V & Technical Support"]
# Add "Lobby Area" here if the desk also reaches out for lobby bookings.
room_space_prefixes = ["Classroom Space"]
# The form's other options, listed so they are not counted as unknown.
known_option_prefixes = [
    "To host an event",
    "Lobby Area",
    "Other",
    "CCI Operational Assistance",
    "SCIS Operational Assistance",
    "Event Catering",
    "Marketing Support",
]
# The mailbox requesters add as a Zoom alternative host, shown on event outreach rows (one
# address, such as "events@example.edu"); empty, the rows say "our shared mailbox".
alt_host_mailbox = ""

[tdx.alerts]
# "tdx audit --send" and "tdx watch": a finding is sent once, then again every realert_days
# (1-60) while it stays open, or every old_realert_days (1-90) once it is old_finding_days
# (1-3650) old. A finding that clears and comes back is sent as new.
realert_days = 3
old_finding_days = 30
old_realert_days = 7
# Ticket titles on the card are cut to this many characters (20-200).
title_chars = 80
# Rows on one card (1-50); the rest wait for the next card.
max_rows_per_card = 25
# "Ready to close" findings are listed in shift summaries only; true also sends them on alert
# cards like any other finding.
alert_ready_to_close = false

[tdx.watch]
# "tdx watch": minutes between runs (30-60), and failed runs in a row before it stops (1-10).
interval_minutes = 30
failures_before_stop = 3
# Minutes between quiet checks while the TDX sign-in has expired (5-30).
signed_out_retry_minutes = 10

[tdx.summary]
# Queue summaries at shift starts, posted by "tdx watch" to this chat only (the desk runner,
# "tdx watch --to desk", which needs teams.desk.approved). See docs/USAGE.md, "Shift summaries".
enabled = false
destination = "desk"
# A slot the auditor could not post on time is posted late until this many minutes after it
# (15-240); after that it is skipped. Either way one notice goes to your personal chat.
grace_minutes = 90
# "none", "everyone" (undocumented by Microsoft for cards: test it with
# "teams test --to desk --mention") or "people". Sign-in addresses for "people" are personal
# data: list them in mention_people in your own config only, never in this file.
mention = "none"
mention_people = []
# "Events this week": unclaimed events with a date this many days from the summary time (1-30).
events_days = 7
# The day's first summary posted is full; later slots post only what changed, or nothing. While
# summaries go to the desk chat, "tdx watch --to desk" sends its alert cards to your personal
# chat (personal_alerts) instead of the desk chat; desk_alerts = true sends them to the desk chat as before.
desk_alerts = false
personal_alerts = true
# The one exception: an event that needs action within tdx.events.near_event_days of its date
# goes to the desk chat at once, on a short "Event soon" card with no mention (once per ticket
# and kind), or into the summary when one is due that run. Desk summaries and
# teams.desk.approved only; false keeps the desk chat to summaries only.
urgent_events_to_desk = true

[tdx.summary.times]
# "HH:MM" per weekday, each inside that day's desk hours. This table replaces the defaults
# as a whole: a day left out has no summaries.
mon = ["07:30", "12:00", "17:00"]
tue = ["07:30", "12:00", "17:00"]
wed = ["07:30", "12:00", "17:00"]
thu = ["07:30", "12:00", "17:00"]
fri = ["07:30", "12:00", "17:00"]
sat = ["08:00", "12:00", "17:00"]
sun = ["12:00"]

[tdx.api]
# The TDX Web API as a second, read-only source of the same queue (docs/USAGE.md, "TDX API
# (proof of concept)"). Off by default; the browser stays the default source. The token comes
# from your own SSO sign-in and lives in the system keychain, never here.
enabled = false
base_path = "/TDWebApi/api"
# The ticketing app's id (the number after /Apps/ in a ticket's address); 0 finds it.
app_id = 0
# The two reports that show the same tickets and columns as the dashboard's widgets;
# "ops-suite tdx api reports" lists the ones you can see.
unclaimed_report_id = 0
claimed_report_id = 0
timeout_seconds = 30
# At least 1000: TDX allows 60 calls a minute per address on most endpoints.
min_request_interval_ms = 1100
# The Web API has a sign-in of its own (MFA included): how long "tdx login" and
# "tdx api token --headed" wait for you to finish it in the window, 1 to 15 minutes.
token_sign_in_minutes = 5
# source = "api": a run's API read sends no request after this many seconds (30-1200), and
# the browser reads that run instead.
max_cycle_seconds = 300

[tdx.shadow]
# Shadow mode, for a side-by-side trial: set source = "shadow" under [tdx] (it needs
# [tdx.api] enabled and both report ids). Each "tdx watch" cycle then also reads the same
# tickets through the API and records counts only; cards still come from the browser alone.
# "ops-suite tdx api compare" prints the comparison (docs/USAGE.md, "Shadow mode").
# The API part of a cycle stops after this many seconds (30-1200); a stop is recorded, never
# a failed cycle.
max_seconds = 300
# source = "api": also read the same tickets through the browser after each run, to compare
# (counts only; it never posts). Each run is recorded by source either way.
enabled = true

[teams]
# The Workflows webhook URL is a secret: "ops-suite teams set-webhook" keeps it in the system
# keychain, never in this file. Its host must end with one of these.
webhook_host_suffixes = [".logic.azure.com", ".api.powerplatform.com"]
# Seconds to wait for Teams to answer (5-120).
timeout_seconds = 30

# Two destinations, each with its own webhook in the keychain and its own alert state:
# "personal" (your own chat, the default) and "desk" (the desk's shared chat, with --to desk).
# See docs/USAGE.md, "Desk chat".
[teams.personal]
show_titles = true

[teams.desk]
# Real ticket cards go to the desk chat only when this is true. Set it in your own config only
# once the desk's lead has approved real ticket cards in the shared chat, in writing.
# Synthetic cards ("teams test --to desk", "tdx demo --send --to desk") may go there at any time.
approved = false
# Ticket titles can contain names, so desk cards show the id, the finding and the age only.
show_titles = false
# Who desk cards ask to act, as a sentence names them: "The help desk, please follow up on
# these before the event." 1-40 characters on one line. Personal cards say "you" instead.
team_name = "the help desk"

[llm]
# The optional Claude API step. Off by default. The API key is a secret: "ops-suite llm set-key"
# keeps it in the system keychain, never in this file.
enabled = false
# Text from TDX tickets and the shared mailbox is the institution's data (it may include student
# records). Set this to true only in your own config on your own machine, and only once your
# institution has approved sending scrubbed ticket text to the API. Never set it to true in a
# file in the repository. Unknown keys in this section stop the tool, so a misspelt name is
# never silently ignored.
allow_institutional_data = false
model = "claude-haiku-5-5"
# How much the model thinks before answering: "low", "medium" or "high".
effort = "low"
# Output tokens per call (16-4096).
max_output_tokens = 256
# Characters of scrubbed text sent per call (200-20000); longer text is cut, and the cut counted.
max_input_chars = 2000
# Tokens per day, in the schedule's time zone, before calls stop (1000-10000000). Input, output
# and cache writes count in full, cache reads at 10%.
daily_token_budget = 100000
# Seconds to wait for the API (5-120).
timeout_seconds = 30
# US dollars per million tokens, for the cost estimate in logs and "llm status" only.
input_usd_per_mtok = 0.10
output_usd_per_mtok = 0.50
cache_read_usd_per_mtok = 0.01

[schedule]
# Desk hours: background loops run only inside these windows, in this time zone.
timezone = "America/New_York"

[schedule.desk_hours]
# One "HH:MM-HH:MM" window per day, start before end (no window past midnight).
# "" or a missing day means closed.
mon = "07:30-22:00"
tue = "07:30-22:00"
wed = "07:30-22:00"
thu = "07:30-22:00"
fri = "07:30-22:00"
sat = "08:00-18:00"
sun = "12:00-17:00"
