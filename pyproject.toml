[project]
name = "ops-suite"
version = "0.1.0"
description = "AI operations toolkit for a university IT service desk: mail scan, Teams alerts, queue audit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "keyring>=25.7.0",
    "platformdirs>=4.12.2",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "truststore>=0.10.5",
    "tzdata>=2026.5",
]

[project.scripts]
ops-suite = "ops_suite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_suite"]

[tool.uv]
# Build .venv on a Python that uv manages (3.12 from .python-version, downloaded when
# missing), never a system one: the Microsoft Store Python hides what it writes under
# %LOCALAPPDATA% in a private copy (payload 20).
python-preference = "only-managed"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff formats Python code blocks in Markdown; the interface sketches in docs/ are not code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: starts a real Playwright Chromium (headed or headless) against local fixture pages",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
